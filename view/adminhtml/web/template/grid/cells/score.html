<div class="bce-completeness-score-cell" data-bind="attr: {'data-band': $col.getBand($row())}">
    <!-- ko if: $col.hasScore($row()) -->
    <strong class="bce-completeness-score-cell__number" data-bind="text: $col.getLabel($row())"></strong>
    <span data-bind="css: $col.getChipClass($row())">
        <svg class="bce-completeness-chip__icon" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path data-bind="attr: {d: $col.getIconPath($row())}" fill="currentColor" fill-rule="evenodd"></path>
        </svg>
        <span data-bind="text: $col.getBandLabel($row())"></span>
    </span>
    <!-- /ko -->
    <!-- ko ifnot: $col.hasScore($row()) -->
    <span class="bce-completeness-muted" data-bind="i18n: $col.noScoreLabel"></span>
    <!-- /ko -->
</div>
